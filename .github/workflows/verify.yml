name: Verify research snapshot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verify.py
      - run: python scripts/reproduce.py
      - run: python circuits/verify_publication.py
      - run: python circuits/tests/test_circuit_ops.py
      - run: python -m unittest discover -s circuits/tests -p test_publication.py -v
      - run: python research/2026-09-16/verify.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reanalyze_ephys.py --list
  ephys-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ephys.txt
      - run: python -m pip install -r requirements-ephys.txt
      - run: python -m unittest discover -s tests -v
